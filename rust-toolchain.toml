# Пин компилятора Rust (F-11, аудит 3; перевыпуск — снято самопротиворечие).
#
# ЧТО ПИНИТ ЭТОТ ФАЙЛ: только ВЕРСИЮ. Платформа/host — ответственность платформенного слоя.
#
# Полный триплет (`1.98.1-x86_64-pc-windows-gnu`, как было в первом выпуске F-11) в этом
# файле rustup ЗАПРЕЩАЕТ, и запрет заложен в самом rustup:
#   src/config.rs, find_override_config: «Do not permit architecture/os selection in
#   channels as these are host specific and toolchain files are portable» →
#     error: target tuple in channel name '<channel>'
#   Исключение — ровно такой тулчейн уже установлен на машине (PR #2141). Поэтому локально
#   на Windows-машине прогона файл «работал» (там этот тулчейн установлен) и противоречие
#   не всплывало, а на ubuntu-раннере, где такого тулчейна нет, ломается первая же
#   rustup-команда. Замерено на реальном раннере (run 35308742887, ветка ci-probe-results):
#     rustup show → «active toolchain: no active toolchain»
#     rustc -vV   → error: target tuple in channel name '1.98.1-x86_64-pc-windows-gnu'
#   То есть до установки дело не доходит вообще: имя валидируется на разборе файла.
#   (Гейт `--force-non-host` — про CLI-пути `rustup toolchain install`/`--toolchain`,
#   к toolchain-файлу он не применяется.)
#
# Host-less канал rustup резолвит в свой default host: на машине прогона это
# x86_64-pc-windows-msvc (`rustup show` → «Default host: x86_64-pc-windows-msvc»),
# на ubuntu-раннере — x86_64-unknown-linux-gnu (замерено той же пробой: «active because:
# overridden by '…/rust-toolchain.toml'», release=1.98.1).
#
# Отсюда инвариант — host задаётся там, где он известен:
#   * Windows/GNU (прод-сборка, w64devkit + self-contained линкер): scripts/local-env.sh
#     читает версию отсюда и экспортирует RUSTUP_TOOLCHAIN=1.98.1-x86_64-pc-windows-gnu
#     (env-переменная приоритетнее файла — проверено: `rustup show` → «active because:
#     overridden by environment variable RUSTUP_TOOLCHAIN»); проверка хоста там же, но
#     теперь как пост-условие пина.
#   * Linux CI: ничего не экспортирует — host-less канал даёт <версию> под host раннера.
#     Шаг «Verify toolchain pin (linux)» в ci.yml печатает резолвнутый тулчейн и падает
#     рано и с внятной причиной, если триплет вернётся в этот файл.
#
# Бамп = осознанная операция: обновить канал здесь, прогнать fmt/clippy/test локально
# после `source scripts/local-env.sh` и дождаться зелёного rust-job на Linux.
[toolchain]
channel = "1.98.1"
