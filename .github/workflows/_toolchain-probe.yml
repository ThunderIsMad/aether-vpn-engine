name: Toolchain probe (temporary, self-reporting)

# ВРЕМЕННЫЙ workflow — удаляется отдельным коммитом после прогона (F-11, аудит 3).
#
# Зачем: подтвердить на РЕАЛЬНОМ ubuntu-раннере, а не «выглядит логично»:
#   (а) старый пин с host-триплетом там действительно ломался — и как именно;
#   (б) текущий version-only пин резолвится в host раннера и проходит ВСЕ обязательные
#       шаги rust-job из ci.yml (fmt / clippy / tests + e2e-фича + сборка boring-sys).
#
# Первый прогон пробы (run 35308742887) уже дал ответ по (а) и по резолву (б), но шаги
# сборки в нём не выполнились: раннер запускает `run:` как `bash -e`, поэтому падение
# первой же команды обрывало шаг. Здесь каждый шаг начинается с `set +e` — только так
# снимаются ВСЕ результаты, а не первый.
#
# Как возвращается результат: репозиторий приватный, Actions API снаружи недоступен (404),
# gh CLI и токена в окружении нет. Поэтому лог пишется коммитом в служебную ветку
# `ci-probe-results` встроенным GITHUB_TOKEN раннера — только git-операции, без внешних
# токенов и секретов. Ветка служебная: перезаписывается (--force) каждым прогоном.
#
# push сюда триггерит ТОЛЬКО этот файл: ci.yml в этой ветке слушает push лишь в main.

on:
  push:
    branches: [third-audit-fixes]

permissions:
  contents: write # исключительно для возврата логов в служебную ветку

jobs:
  toolchain-probe:
    name: rust-toolchain.toml on linux (probe)
    runs-on: ubuntu-latest
    env:
      EVIDENCE_BRANCH: ci-probe-results
      LOG: ci-probe/probe-log.txt
    steps:
      # persist-credentials: true — единственное отличие от остальных job'ов ci.yml
      # (там false): здесь нужен push логов обратно в репозиторий.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      # То же, что в обязательном rust-job: boring-sys собирается и на linux (bindgen).
      - name: Install boring-sys build dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev

      - name: Prepare log
        run: |
          mkdir -p ci-probe
          : > "$LOG"

      # Маркер «прогон стартовал»: отличает «workflow не триггернулся / нет прав на push
      # в служебную ветку» от «прогон идёт». continue-on-error — чтобы сбой маркера не
      # отменял сбор основного лога.
      - name: Evidence marker (started)
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$EVIDENCE_BRANCH"
          {
            echo "probe started"
            echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "sha: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            rustup --version 2>&1 | head -1
            date -u
          } > ci-probe/STARTED.txt
          git add ci-probe/STARTED.txt
          git commit -m "probe: run started ($GITHUB_SHA)"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"

      # (а) Что Linux-раннер делает со СТАРЫМ пином (полный триплет). Каталог вне
      # репозитория, чтобы файл из репо не подмешивался (rustup ищет rust-toolchain.toml
      # вверх по дереву).
      - name: "Experiment (a): old pin - host triple - on linux"
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/old-pin && cd /tmp/old-pin
          printf '[toolchain]\nchannel = "1.98.1-x86_64-pc-windows-gnu"\n' > rust-toolchain.toml
          {
            echo
            echo "================ (а) СТАРЫЙ пин: channel = \"1.98.1-x86_64-pc-windows-gnu\" ================"
            echo "cwd: $(pwd)  файл: rust-toolchain.toml (вне репозитория)"
            echo "--- rustup --version ---"
            rustup --version 2>&1 | head -1
            echo "--- rustup show ---"
            rustup show 2>&1; echo "exit=$?"
            echo "--- rustc -vV ---"
            rustc -vV 2>&1; echo "exit=$?"
            echo "--- cargo --version ---"
            cargo --version 2>&1; echo "exit=$?"
            echo "--- rustup toolchain list -v ---"
            rustup toolchain list -v 2>&1
            echo "--- ожидание: error 'target tuple in channel name …' и никакой установки"
          } >> "$GITHUB_WORKSPACE/$LOG" 2>&1
          cd "$GITHUB_WORKSPACE"

      # (б) Предмет: текущий пин из репозитория + ровно те проверки, что делает новый
      # шаг «Verify toolchain pin (linux)» в ci.yml.
      - name: "Repo pin (b): resolve + guard"
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          {
            echo
            echo "================ (б) ТЕКУЩИЙ пин из репозитория (version-only) ================"
            echo "--- rust-toolchain.toml (последние строки) ---"
            tail -n 3 rust-toolchain.toml
            echo "--- rustup show ---"
            rustup show 2>&1; echo "exit=$?"
          } >> "$LOG" 2>&1
          want="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          release="$(rustc -vV | sed -n 's/^release: //p')"
          {
            echo "resolved: channel=$want host=$host release=$release"
            case "$want" in
              *-windows-*|*-apple-*|*-linux-*|*-unknown-*) echo "GUARD-toolchain-file: FAIL (триплет вернулся)";;
              *) echo "GUARD-toolchain-file: ok";;
            esac
            case "$host" in
              *-windows-*|*-apple-*) echo "GUARD-host: FAIL ($host)";;
              *) echo "GUARD-host: ok";;
            esac
            if [[ "$want" == *.* ]] && [ "$release" != "$want" ]; then
              echo "GUARD-version: FAIL ($release != $want)"
            else
              echo "GUARD-version: ok"
            fi
          } >> "$LOG" 2>&1

      # Ровно тот же шаг, что в ci.yml: компоненты из профиля раннера (minimal) не приходят,
      # их надо добавить в ПИНОВАННЫЙ тулчейн — иначе fmt/clippy падают «not installed».
      - name: Ensure clippy and rustfmt (same as ci.yml)
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          {
            echo
            echo "================ rustup component add clippy rustfmt ================"
            rustup component add clippy rustfmt 2>&1; echo "exit=$?"
            echo "--- rustup component list --installed ---"
            rustup component list --installed 2>&1
            echo "--- rustc -vV ---"
            rustc -vV 2>&1
          } >> "$LOG" 2>&1

      # Те самые шаги обязательного rust-job (плюс best-effort e2e из ci.yml).
      - name: "Mandatory rust job steps (fmt / clippy / tests)"
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          run_step() {
            local n="$1"; shift
            echo >> "$LOG"
            echo "================ $n ================" >> "$LOG"
            echo "\$ $*" >> "$LOG"
            "$@" > "ci-probe/raw-$n.log" 2>&1
            echo "exit=$?" >> "$LOG"
            grep -E "^(test result:|error)" "ci-probe/raw-$n.log" >> "$LOG"
            tail -n 5 "ci-probe/raw-$n.log" >> "$LOG"
          }
          run_step fmt cargo fmt --all --check
          run_step test-workspace cargo test --locked --workspace --all-targets
          run_step clippy-workspace cargo clippy --locked --workspace --all-targets -- -D warnings
          run_step clippy-e2e cargo clippy --locked -p e2e-harness --all-targets --all-features -- -D warnings
          run_step test-e2e cargo test --locked -p e2e-harness --all-features
          {
            echo
            echo "================ итоговые числа (из raw-логов) ================"
            printf 'test-workspace: %s\n' "$(grep -E '^test result:' ci-probe/raw-test-workspace.log | awk '{p+=$4; f+=$6; i+=$8} END {print p" passed / "f" failed / "i" ignored}')"
            printf 'test-e2e:       %s\n' "$(grep -E '^test result:' ci-probe/raw-test-e2e.log | awk '{p+=$4; f+=$6} END {print p" passed / "f" failed}')"
          } >> "$LOG" 2>&1

      # Возврат логов. if: always() — логи нужны и когда что-то упало (все шаги выше
      # continue-on-error, так что до сюда доходим всегда).
      - name: Return evidence (commit logs to the scratch branch)
        if: always()
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$EVIDENCE_BRANCH"
          git add -A ci-probe
          git commit -m "probe: rust-toolchain.toml evidence on linux ($GITHUB_SHA)"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
