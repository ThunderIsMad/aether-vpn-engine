name: CI

# P2-гигиена (аудит F-SEC-11 / CIL): actions запинены по SHA (теги мутабельны),
# persist-credentials: false, PyPI-зависимости запинены. Бамп = новый SHA + комментарий.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install validator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/skill-venv"
          "$RUNNER_TEMP/skill-venv/bin/pip" install --quiet pyyaml==6.0.3

      - name: Validate .agents/skills
        run: |
          "$RUNNER_TEMP/skill-venv/bin/python" scripts/validate_skills.py

  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # b132: boring — прод-зависимость workspace (cover-reality) → boring-sys собирается
      # в обязательном rust-job. На Linux: cmake обязателен, libclang-dev нужен bindgen'у
      # (apt-пакет вместо PyPI-колеса на Windows), NASM не нужен (ASM_NASM в CMakeLists
      # BoringSSL только для Windows; см. reality-boring-probe.md шаг 6).
      - name: Install boring-sys build dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev

      - name: Detect workspace
        id: ws
        run: |
          if [ -f Cargo.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No workspace yet
        if: steps.ws.outputs.found == 'false'
        run: echo "::notice title=Rust job skipped::No Cargo.toml at the repo root yet; the Phase 0 scaffold has not run, so cargo test/clippy are not enforced."

      # F-11 (перевыпуск): evidence на Linux + защита от возврата host-триплета в
      # rust-toolchain.toml. rustup такие имена в toolchain-файле запрещает по построению
      # («toolchain files are portable», src/config.rs → `error: target tuple in channel
      # name '<channel>'`), с исключением «этот тулчейн уже установлен» (PR #2141) — именно
      # поэтому на Windows-машине файл с триплетом выглядел работающим. Замер на раннере
      # (run 35308742887): со старым значением `rustc -vV` падал с этой ошибкой, с текущим
      # активен 1.98.1-x86_64-unknown-linux-gnu (release 1.98.1). Шаг печатает резолвнутый
      # тулчейн и падает рано с внятной причиной, если триплет вернётся в файл.
      - name: Verify toolchain pin (linux)
        if: steps.ws.outputs.found == 'true'
        run: |
          set -euo pipefail
          want="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          if [ -z "$want" ]; then
            echo "::error::не прочитал channel из rust-toolchain.toml"
            exit 1
          fi
          case "$want" in
            *-windows-*|*-apple-*|*-linux-*|*-unknown-*)
              echo "::error::rust-toolchain.toml несёт host-триплет ($want): для rustup это non-host toolchain, авто-установка скачала бы компилятор чужой платформы. Пину положено нести только версию — host задаёт платформенный слой (scripts/local-env.sh на Windows, сам раннер в CI)."
              exit 1 ;;
          esac
          # Явная установка пина: авто-установка тулчейна из toolchain-файла объявлена rustup'ом
          # устаревшей («auto-installation is deprecated for most `rustup` commands») — CI не
          # должен на неё опираться (замечание из живого лога, run 35308984056).
          rustup toolchain install "$want"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          release="$(rustc -vV | sed -n 's/^release: //p')"
          rustup show
          echo "resolved toolchain: channel=$want host=$host release=$release"
          case "$host" in
            *-windows-*|*-apple-*)
              echo "::error::активный toolchain собран не для этого раннера ($host)"
              exit 1 ;;
          esac
          if [[ "$want" == *.* ]] && [ "$release" != "$want" ]; then
            echo "::error::версия rustc ($release) не совпадает с пином ($want) — пин не применился"
            exit 1
          fi

      - name: Ensure clippy and rustfmt
        if: steps.ws.outputs.found == 'true'
        run: rustup component add clippy rustfmt

      - name: cargo fmt --check
        if: steps.ws.outputs.found == 'true'
        run: cargo fmt --all --check

      # --locked (F-11): lockfile закоммичен — обязателен к использованию; расхождение
      # Cargo.toml/Cargo.lock в PR ломает CI, а не тихо обновляет пины.
      - name: cargo test
        if: steps.ws.outputs.found == 'true'
        run: cargo test --locked --workspace --all-targets

      - name: cargo clippy
        if: steps.ws.outputs.found == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # E2E-лаборатория Phase 1: бины не запускаются (сети раннера не гарантированы),
      # но код бинов и QUIC-лаборатории должен компилироваться и проходить clippy.
      # Юнит-тесты крейта (wire, quic_lab, lib) идут в обычном `cargo test` выше.
      - name: cargo clippy (e2e feature)
        if: steps.ws.outputs.found == 'true'
        run: cargo clippy --locked -p e2e-harness --all-targets --all-features -- -D warnings

      # Тесты за фичей `e2e` (bind на 127.0.0.1:0): на раннере может быть запрещён —
      # шаг мягкий (continue-on-error), красный по сетевой причине не блокирует pipeline.
      - name: cargo test (e2e feature, best-effort)
        if: steps.ws.outputs.found == 'true'
        continue-on-error: true
        run: cargo test --locked -p e2e-harness --all-features

  # Разведка platform parity для Reality-обложки (DEPENDENCIES.md F11): линкуется ли
  # boring 4.x на Linux-раннере так же чисто, как на локальной Windows/GNU машине
  # (docs/phase-reports/reality-boring-probe.md, шаги 1–3).
  # УСТАРЕЛО как разведка (F-11, аудит 3): с f226d05 boring — прод-зависимость workspace
  # и собирается в обязательном rust-job на том же Linux-раннере при каждом push —
  # двойная сборка BoringSSL на каждый пуш разведывательной ценности не даёт. Job
  # переведён на workflow_dispatch (ручной запуск): остаётся под рукой для целевых
  # проверок платформы (новый раннер-образ, бамп boring), не гоняется впустую.
  # НЕ Reality: никаких логики ClientHello/active-probe — только сборка+запуск
  # минимального пробного крейта ci-probes/boring-linux (вне workspace, exclude в
  # корневом Cargo.toml).
  # Отличия от Windows/GNU-пробы (по исходникам boring-sys 4.22 и вендоренному
  # CMakeLists.txt BoringSSL): NASM на Linux НЕ нужен (CMakeLists включает ASM_NASM
  # только для Windows x86/x86_64, Linux-asm идёт через компилятор C); ninja-build не
  # обязателен (сломанный busybox-sh был только на Windows); libclang нужен bindgen'у
  # как и на Windows, но здесь это apt-пакет, а не PyPI-колесо.
  reality-boring-probe-linux:
    name: Reality boring probe (linux, recon)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install boring-sys build dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev

      - name: cargo build (ci-probes/boring-linux)
        run: cargo build --manifest-path ci-probes/boring-linux/Cargo.toml

      - name: run probe
        run: ci-probes/boring-linux/target/debug/boring-linux-probe

  # ========================================================================
  # ВРЕМЕННЫЙ job подтверждения реального прогона на main (удаляется отдельным
  # коммитом сразу после прочтения отчёта). Существующие job'ы skills и rust он
  # НЕ трогает: их шаги здесь дословно те же, что в чистом dc0602e — этот job
  # только читает их итоги и складывает отчёт коммитом в служебную ветку.
  #
  # Канал: встроенный GITHUB_TOKEN раннера (actions: read + contents: write), а не
  # внешний токен — репозиторий приватный (Actions API снаружи отдаёт 404), а сам
  # ci.yml устроен read-only (`permissions: contents: read`, persist-credentials:
  # false), т.е. git-следов прогона не оставляет. Поэтому итоги снимаются API-вызовом
  # с правами этого job'а и кладутся в ветку ci-probe-results.
  # ========================================================================
  report-run:
    name: Report real run (temporary)
    runs-on: ubuntu-latest
    needs: [skills, rust]
    if: ${{ always() }}
    permissions:
      actions: read   # чтение job'ов, шагов и логов ЭТОГО прогона
      contents: write # запись отчёта в служебную ветку
    env:
      EVIDENCE_BRANCH: ci-probe-results
      OUT: ci-probe/main-run-report.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Collect evidence (job/step statuses + test numbers)
        run: |
          # Actions запускает run-блоки как `bash -e`: свои падения собираем сами
          set +e
          set -uo pipefail
          GH_TOKEN="${{ github.token }}"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          mkdir -p ci-probe
          command -v jq >/dev/null || sudo apt-get install -y --no-install-recommends jq
          command -v unzip >/dev/null || sudo apt-get install -y --no-install-recommends unzip
          {
            echo "================ РЕАЛЬНЫЙ ПРОГОН ci.yml НА MAIN ================"
            echo "sha:     $GITHUB_SHA"
            echo "ref:     $GITHUB_REF"
            echo "event:   $GITHUB_EVENT_NAME"
            echo "run:     $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "run url: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "---- итог job'ов (needs, виден и без API) ----"
            echo "skills: ${{ needs.skills.result }}"
            echo "rust:   ${{ needs.rust.result }}"
          } > "$OUT" 2>&1

          # --- job'ы и шаги этого прогона ---
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" -o jobs.json
          echo "curl jobs exit=$?" >> "$OUT"
          {
            echo
            echo "---- job'ы и шаги (Actions API, имя/статус/итог) ----"
            jq -r '.jobs[] | "[\(.name)] \(.status)/\(.conclusion) id=\(.id)", (.steps[]? | "    - \(.number). \(.name): \(.status)/\(.conclusion)")' jobs.json
          } >> "$OUT" 2>&1

          # --- логи обязательных job'ов: точные числа тестов и строка резолва пина ---
          jq -r '.jobs[] | select((.name == "Validate skills") or (.name | startswith("Rust"))) | .id' jobs.json > jobids.txt
          cat jobids.txt >> "$OUT"
          while read -r jid; do
            [ -n "$jid" ] || continue
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$API/actions/jobs/$jid/logs" -o "log-$jid.zip"
            echo "curl log $jid exit=$?" >> "$OUT"
            rm -rf "log-$jid"
            unzip -o -q "log-$jid.zip" -d "log-$jid" 2>>"$OUT" && \
              cat "log-$jid"/* > "raw-$jid.log" 2>/dev/null && \
              sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' "raw-$jid.log" \
                | sed -E 's/\x1b\[[0-9;]*m//g' > "clean-$jid.log"
          done < jobids.txt

          {
            echo
            echo "---- числа тестов ПО ШАГАМ (из групп логов; сравнить с 107/0/2 и 16/0) ----"
            awk '
              /^##\[group\]Run / { cur=$0; sub(/^##\[group\]Run /, "", cur) }
              /^test result:/   { p[cur]+=$4; f[cur]+=$6; i[cur]+=$8 }
              END { for (c in p) printf "%-72s passed=%d failed=%d ignored=%d\n", c, p[c], f[c], i[c] }
            ' clean-*.log 2>/dev/null | sort
            echo
            echo "---- пин toolchain в реальном прогоне ----"
            grep -hE "^(resolved toolchain|name:|active because:|release:|host:)" clean-*.log 2>/dev/null | head -12
            echo
            echo "---- признаки отказа в логах (пусто = нет) ----"
            grep -hE "^error|^error\[|^::error::|^panicked" clean-*.log 2>/dev/null | head -30
          } >> "$OUT" 2>&1
          echo "collect finished" >> "$OUT"

      - name: Publish evidence to the scratch branch
        if: ${{ always() }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$EVIDENCE_BRANCH"
          cp "$OUT" ci-probe/ 2>/dev/null || true
          cp clean-*.log raw-*.log jobs.json log-*.zip ci-probe/ 2>/dev/null || true
          git add -A ci-probe
          git commit -m "report: real ci.yml run on main ($GITHUB_SHA, run $GITHUB_RUN_ID)"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
