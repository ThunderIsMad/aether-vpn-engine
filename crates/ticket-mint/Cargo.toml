[package]
name = "ticket-mint"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Крейт стороны узла намеренно не тянет клиентские крейты (`crypto-core` с clatter в дереве
# не нужен, чтобы узлу выдать ticket): он берёт только те примитивы, которые сам использует
# (03-components.md, «Порядок зависимостей для сборки» его не запрещает, но связанность здесь
# не нужна и не полезна).
# AEAD тикета (02 §3.2), проверка PoP-подписи (02 §3.3), ключ consumed-set (02 §3.6).
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
# Случайный nonce тикета (24 B): AEAD обязан быть probabilistic (закрытие аудита F-SEC).
getrandom = "0.3"
