[package]
name = "cover-ss2022"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Обложка Phase 1 (кусок 1): кадрирует уже sealed records frame-слоя и добавляет
# собственный AEAD-слой + padding. Крипта — crypto-core (XChaCha20-Poly1305),
# типы записей — frame-session, контракт байндинга — transport-mux.
crypto-core.workspace = true
frame-session.workspace = true
transport-mux.workspace = true
# Системный CSPRNG для nonce/padding прод-пути (F-01: детерминированный xorshift
# в send() был прод-дефектом). Тот же паттерн explicit-fail, что в ticket-mint.
getrandom.workspace = true
