[package]
name = "cover-reality"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
frame-session.workspace = true
transport-mux.workspace = true
crypto-core.workspace = true
# Системный CSPRNG для nonce прод-пути (F-01: детерминированный xorshift в send()
# был прод-дефектом). Тот же паттерн explicit-fail, что в ticket-mint.
getrandom.workspace = true
# TLS-бэкенд контроля ClientHello (Reality-обложка). Первая прод-зависимость boring:
# линковка рядом с rustls/ring проверена пробами на обеих платформах
# (docs/phase-reports/reality-boring-probe.md, F11 DEPENDENCIES.md).
# TTL и дата перепроверки — в DEPENDENCIES.md (как у остальных прод-пинов).
boring.workspace = true
# Скелет сертификата Accept-пути (Q23): self-signed Ed25519-заготовка, поле подписи
# которой перезаписывается per-handshake (см. workspace-комментарий и QUESTIONS.md Q23).
rcgen.workspace = true
