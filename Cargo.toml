[workspace]
resolver = "2"
members = ["crates/*"]
# ci-probes/boring-linux — разведочный крейт (boring на Linux CI, platform parity,
# docs/phase-reports/reality-boring-probe.md). Не member и не прод-зависимость:
# без exclude cargo при сборке из каталога крейта найдёт корневой workspace по
# предкам и упадёт ("believes it's in a workspace"). Исключение видит каждый, кто
# открывает корневой манифест — в отличие от неявной «вне дерева».
exclude = ["ci-probes/boring-linux"]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
# --- Phase 0 pins: снято с crates.io 2026-09-16, TTL 90d (перепроверка до 2026-12-15) ---
# См. DEPENDENCIES.md → «Phase 0 pins». Ни одна из версий не является «предположительно
# последней»: это результат запроса max_stable_version на дату прогона.
quinn = "0.11.12"
# Набор фич задан явно: default-набор тянет ОБА KEM-бэкенда, а `use-rust-crypto-ml-kem`
# приводит транзитивный `ml-kem 0.2.1`, который не собирается сегодня (первый прогон CI,
# 2026-09-16: `could not compile ml-kem (lib) due to 18 previous errors`). KEM-бэкенд —
# ТОЛЬКО `pqclean` (решение Phase 0.5: второй бэкенд не тянется нигде); `ml-kem 0.3.2`
# остаётся нашей прямой зависимостью (`crypto-core`, KAT FIPS 203 + interop против PQClean).
# Подробности — `QUESTIONS.md` Q8, `DEPENDENCIES.md` → «Phase 0.5».
clatter = { version = "2.3.0", default-features = false, features = [
    "std",
    "alloc",
    "getrandom",
    "use-25519",
    "use-chacha20poly1305",
    "use-sha",
    "use-pqclean-ml-kem",
] }
# `getrandom` нужен для `MlKem768::generate_keypair()` и `encapsulate()` в KAT/interop-тесте
# `crypto-core`; без него доступны только `new_from_slice`/`decapsulate_slice`.
ml-kem = { version = "0.3.2", features = ["getrandom"] }
chacha20poly1305 = "0.11.0"
# CSPRNG (F-10): прод-nonce обложек (`cover-ss2022`, `cover-reality`) и nonce тикета
# (`ticket-mint`). Пин в workspace по правилу проекта — у крейтов только `.workspace = true`.
getrandom = "0.3"
# HKDF и SHA-256 для вывода `K_session`/`K_resume`/ratchet записей (`02 §1`, §3.3, §5).
# Пара версий — из одного поколения RustCrypto (digest 0.11); смотри DEPENDENCIES.md.
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
x25519-dalek = "3.0.0"
ed25519-dalek = "3.0.0"
# MASQUE CONNECT-UDP (Phase 1, кусок 4): live-слой обложки на собственном h3-клиенте.
# Owner: cover-masque. Запинен с 2026-09-16, в дело пошёл 2026-09-18 — факты совместимости
# сняты с исходников (см. DEPENDENCIES.md → «Phase 1: MASQUE live interop»):
#   - h3 0.0.8: extended CONNECT кодируется (http::Request + h3::ext::Protocol::CONNECT_UDP
#     → «:protocol: connect-udp», proto/headers.rs), SETTINGS H3_DATAGRAM (0x33) и
#     SETTINGS_ENABLE_CONNECT_PROTOCOL отдаются builder'ами клиента и сервера.
#   - HTTP Datagrams (RFC 9297) в самом h3 НЕ реализованы — их даёт пара h3-quinn(фича
#     datagram) + h3-datagram: quic-trait-адаптер SendDatagramHandler/RecvDatagramHandler
#     поверх quinn::Connection::send_datagram/read_datagram,Quarter Stream ID кодирует
#     h3-datagram (datagram.rs, /4 + varint, RFC 9297 §4).
#   - Дерево: ровно ОДНА копия h3 0.0.8 и quinn 0.11.12 (тот же workspace-пин), tokio 1
#     общий; новый транзитивный провайдер крипто не тянет.
h3 = "0.0.8"
# Транспорт-адаптер h3↔quinn; версия парная к h3 0.0.8 (репо hyperium/h3, тот же релиз-цикл).
# quinn-требование 0.11.7 (default-features=false, futures-io) совместимо с нашим пином
# 0.11.12 (cargo tree: одна копия). Фича `datagram` включает dep:h3-datagram.
h3-quinn = { version = "0.0.10", features = ["datagram"] }
# RFC 9297 HTTP Datagrams поверх h3 0.0.8 (pre-1.0, тот же репо; API — ext-трейты
# HandleDatagramsExt для h3::client::Connection и h3::server::Connection).
h3-datagram = "0.0.2"

# Reality-обложка (Phase 1, кусок 3): TLS-бэкенд контроля ClientHello (BoringSSL).
# Первая прод-зависимость boring: линковка рядом с rustls/ring и живой TLS-handshake
# обоих стеков в одном процессе проверены пробами на обеих платформах
# (docs/phase-reports/reality-boring-probe.md; риск F11 DEPENDENCIES.md снят).
# TTL 180 дней — тот же класс, что у clatter/ml-kem: перепроверка до 2027-03-16.
# Владелец — cover-reality. Требования сборки boring-sys на Windows/GNU (NASM,
# libclang-колесо, CMAKE_GENERATOR=Ninja) — scripts/local-env.sh (b132, был
# boring-probe-env.sh для пробы); на Linux CI достаточно apt (cmake, libclang-dev;
# NASM не нужен) — см. rust-job и job reality-boring-probe-linux.
boring = "4.22.0"

# Внутренние крейты. Связь `transport-mux → frame-session` — единственная, зафиксированная
# в design/03-components.md («Порядок зависимостей для сборки», интерфейс CoverBinding).
frame-session = { path = "crates/frame-session" }
# Байтовый Buf для h3-datagram (MASQUE live-слой, Phase 1 кусок 4); уже в дереве через
# h3/quinn — пин здесь, чтобы у cover-masque было явное имя версии.
bytes = "1"
# Тип запроса h3-стека (http::Request) — MASQUE live-слой; уже в дереве через h3.
http = "1"
# Скелет сертификата Accept-пути Reality (Q23): rcgen собирает self-signed Ed25519-
# сертификат, поле подписи которого перезаписывается HMAC-SHA512(AuthKey, cert_pub)
# per-handshake (механизм xtls/reality). boring 4.22 штатно Ed25519-сертификат не
# подписывает (MessageDigest::null недоступен — docs/phase-reports/reality-boring-probe.md);
# альтернативы отклонены в QUESTIONS.md Q23. Тот же пин/фичи, что уже проверены в
# e2e-лаборатории (quic_lab): ring-провайдер подписи, без default-features.
# Владелец — cover-reality.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Объявлены для dev-dependencies интеграционного крейта `rotation-tests` (спеки ротации Phase 0),
# рабочего крейта `phase0-path` (склейка однохопового пути) и `cover-ss2022` (Phase 1, кусок 1:
# обложка поверх уже sealed records).
crypto-core = { path = "crates/crypto-core" }
key-coordinator = { path = "crates/key-coordinator" }
policy-engine = { path = "crates/policy-engine" }
ticket-mint = { path = "crates/ticket-mint" }
transport-mux = { path = "crates/transport-mux" }
cover-ss2022 = { path = "crates/cover-ss2022" }
cover-masque = { path = "crates/cover-masque" }
cover-reality = { path = "crates/cover-reality" }
# Live-слой MASQUE (Phase 1, кусок 4): h3-стек — прод-зависимость cover-masque
# (пины выше), h3-quinn дополнительно нужен e2e-лаборатории (серверная сторона h3).
# E2E-лаборатория Phase 1 (ручной прогон, не CI job): см. docs/phase-reports/e2e-manual.md.
e2e-harness = { path = "crates/e2e-harness" }
