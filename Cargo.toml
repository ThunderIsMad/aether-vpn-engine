[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
# --- Phase 0 pins: снято с crates.io 2026-09-16, TTL 90d (перепроверка до 2026-12-15) ---
# См. DEPENDENCIES.md → «Phase 0 pins». Ни одна из версий не является «предположительно
# последней»: это результат запроса max_stable_version на дату прогона.
quinn = "0.11.12"
# Набор фич задан явно: default-набор тянет ОБА KEM-бэкенда, а `use-rust-crypto-ml-kem`
# приводит транзитивный `ml-kem 0.2.1`, который не собирается сегодня (первый прогон CI,
# 2026-09-16: `could not compile ml-kem (lib) due to 18 previous errors`). KEM-бэкенд здесь —
# `pqclean`; `ml-kem 0.3.2` остаётся нашей прямой зависимостью (`crypto-core`, KAT FIPS 203).
# Подробности — `QUESTIONS.md` Q8.
clatter = { version = "2.3.0", default-features = false, features = [
    "std",
    "alloc",
    "getrandom",
    "use-25519",
    "use-chacha20poly1305",
    "use-sha",
    "use-pqclean-ml-kem",
] }
# `getrandom` нужен для `MlKem768::generate_keypair()` и `encapsulate()` в KAT/interop-тесте
# `crypto-core`; без него доступны только `new_from_slice`/`decapsulate_slice`.
ml-kem = { version = "0.3.2", features = ["getrandom"] }
chacha20poly1305 = "0.11.0"
# HKDF и SHA-256 для вывода `K_session`/`K_resume`/ratchet записей (`02 §1`, §3.3, §5).
# Пара версий — из одного поколения RustCrypto (digest 0.11); смотри DEPENDENCIES.md.
hkdf = "0.13.0"
sha2 = "0.11.0"
x25519-dalek = "3.0.0"
ed25519-dalek = "3.0.0"
# Запинено здесь, но нужно только в Phase 1 (MASQUE CONNECT-UDP на quinn+h3).
h3 = "0.0.8"

# Внутренние крейты. Связь `transport-mux → frame-session` — единственная, зафиксированная
# в design/03-components.md («Порядок зависимостей для сборки», интерфейс CoverBinding).
frame-session = { path = "crates/frame-session" }

# Объявлены для dev-dependencies интеграционного крейта `rotation-tests` (спеки ротации Phase 0).
# Это тестовые зависимости: ни один рабочий крейт на них не ссылается, порядок сборки из 03
# не меняется — они здесь только чтобы ссылка была одна на крейт, а не путь на память.
crypto-core = { path = "crates/crypto-core" }
key-coordinator = { path = "crates/key-coordinator" }
ticket-mint = { path = "crates/ticket-mint" }
transport-mux = { path = "crates/transport-mux" }
