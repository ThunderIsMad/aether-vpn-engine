# cargo-deny: автоматический контроль зависимостей (TODO DEPENDENCIES.md, 2026-09-19).
# Выбор против cargo-audit — один и тот же RUSTSEC-контроль advisories плюс политики
# лицензий/дублей/источников, критичные для приватного прод-репозитория (DEPENDENCIES.md).
# Локально:  cargo deny check --locked
# CI:        job deps-deny в .github/workflows/ci.yml ( EmbarkStudios/cargo-deny-action,
#            пин по peeled-коммиту тега, как остальные actions репозитория ).
# Версия локального бинарника = версия в бандле action (0.20.2), чтобы локальный и
# CI-прогоны не расходились в семантике проверок.

[graph]
# all-features НЕ включать: раскрывает clatter/use-rust-crypto-ml-kem — комбинацию,
# исключённую решением Phase 0.5 (QUESTIONS.md Q8: транзитивный ml-kem 0.2.1 не
# собирается). Граф проверяется в заявленном наборе фич Cargo.toml — ровно тот, что
# уезжает в прод. targets не фильтруем: прод Windows/GNU, CI Linux; платформенно-
# специфичные ветки (windows-sys и пр.) в lockfile и так видны обеим проверкам.
# e2e-фича e2e-harness (rustls/rcgen за фичей) вне графа, но оба крейта уже покрыты
# прод-путями (cover-reality, quinn).

[advisories]
# RUSTSEC-advisory (уязвимость) блокирует CI. yank --locked-пина лечится бампом в
# плановом порядке — warn, не deny. Unmaintained/unsound (informational-адизориз)
# в 0.20.x — селектор Scope (all|workspace|transitive|none), а не lint-level: вне
# выбранного scope они не эмитятся, внутри — падение (warn-уровня для них больше
# нет). Политика проекта (решение 2026-09-19): unmaintained/unsound не красят CI —
# они ловятся TTL-перепроверками пинов (DEPENDENCIES.md), где каждый кейс
# разбирается по существу, а не механическим красным.
yanked = "warn"
unmaintained = "none"
unsound = "none"
# Игноры — только с комментарием-решением (правило DEPENDENCIES.md: не глушить бланково).
ignore = []

[licenses]
confidence-threshold = 0.8
# Allow-list снят с registry-исходников всех 228 registry-пакетов Cargo.lock
# (242 блока минус 14 workspace-крейтов; 2026-09-19), не по памяти: каждая строка
# реально встречается в дереве. Разбор неочевидных — DEPENDENCIES.md → «cargo-deny».
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # wit-bindgen <- wasip2 <- getrandom 0.3 (wasi-цели)
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",            # webpki-root-certs <- quinn default platform-verifier
  "ISC",
  "MIT",
  "MIT-0",                          # dunce (build-dep boring-sys)
  "Unicode-3.0",
  "Zlib",
]
# OR-выражения (fiat-crypto: BSD-1-Clause; r-efi: LGPL-2.1+; aho-corasick: Unlicense)
# покрыты разрешёнными ветками — идентификаторы LGPL-2.1+/BSD-1-Clause/Unlicense
# в allow-list не заносятся сознательно: разрешаем фактический выбор, а не весь набор.

[licenses.private]
# 16 workspace-крейтов: publish = false, поля license не имеют (приватный репозиторий).
ignore = true

[bans]
# Дубль-политика: warn, а не deny (решение зафиксировано в DEPENDENCIES.md). Часть
# дублей — resolver-артефакты, не связанные с фактом F-10/Q8 про поколения clatter
# (syn 1/2/3, windows-sys 0.52/0.61); deny заставил бы вписывать все пары в skip
# вручную на каждый cargo update или красить CI на дублях, вообще не относящихся
# к clatter. Правило: новый дубль, не объяснимый существующими фактами, разбирается
# по существу перед мержем. Флип на deny — когда список стабилизируется и станет
# коротким (ревью на TTL-перепроверке пинов, до 2026-12-15).
multiple-versions = "warn"
wildcards = "deny"
# Наследование workspace-зависимостей (foo.workspace = true) cargo-deny считает
# wildcard'ом (версия не указана на месте использования). Все 16 внутренних крейтов —
# publish = false с path-пинами через [workspace.dependencies]; реальных wildcard-версий
# к registry-крейтам нет и появиться не должно. allow-wildcard-paths разрешает ровно
# path-wildcards приватных крейтов (исходник 0.20.2, bans.rs:960: `!is_registry() &&
# is_private`), registry-wildcard (`foo = "*"`) остаётся deny.
allow-wildcard-paths = true
deny = [
  # Крипто-инвариант: только boring/ring. openssl-sys в дереве = второй libcrypto —
  # класс конфликта, снятый пробами для boring (F11 DEPENDENCIES.md), не допускать
  # и через транзитив.
  { crate = "openssl-sys", reason = "крипто-инвариант: только boring/ring, без OpenSSL (риск двух libcrypto — F11)" },
  # Второй rustls-провайдер не используется; путь quinn __rustls-post-quantum-test
  # закрыт решением Q7 (QUESTIONS.md) — тестовая фича, наружу не выставляется.
  { crate = "aws-lc-rs", reason = "второй rustls-провайдер не используется; quinn __rustls-post-quantum-test закрыт (Q7)" },
]

[sources]
# Только crates.io. Произвольные git-зависимости — deny: новая git-зависимость
# требует явного изменения этого файла (diff виден в ревью), а не тихого приезда
# через транзитив.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
